[workspace]
resolver = "2"
members = ["crates/vardefm-dsp", "crates/vardefm-fec", "crates/vardefm-modem", "crates/vardefm-link", "crates/vardefm-sim", "crates/vardefm-tnc", "crates/vardefm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/your-callsign/vardefm"

[workspace.dependencies]
num-complex = "0.4"
rustfft = "6.2"
rand = "0.8"
rand_distr = "0.4"
hound = "3.5"
clap = { version = "4", features = ["derive"] }
vardefm-dsp = { path = "crates/vardefm-dsp" }
vardefm-sim = { path = "crates/vardefm-sim" }
vardefm-fec = { path = "crates/vardefm-fec" }
vardefm-modem = { path = "crates/vardefm-modem" }
vardefm-link = { path = "crates/vardefm-link" }
vardefm-tnc = { path = "crates/vardefm-tnc" }

[profile.release]
debug = 1

[profile.dev]
opt-level = 2
