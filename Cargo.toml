[workspace]
resolver = "2"
members = ["crates/vardefm-dsp", "crates/vardefm-fec", "crates/vardefm-modem", "crates/vardefm-link", "crates/vardefm-sim", "crates/vardefm-tnc", "crates/vardefm-ptt", "crates/vardefm-audio", "crates/vardefm-cli"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/notepid/vardeFM"

[workspace.dependencies]
num-complex = "0.4"
rustfft = "6.2"
rand = "0.8"
rand_distr = "0.4"
hound = "3.5"
clap = { version = "4", features = ["derive"] }
vardefm-dsp = { path = "crates/vardefm-dsp" }
vardefm-sim = { path = "crates/vardefm-sim" }
vardefm-fec = { path = "crates/vardefm-fec" }
vardefm-modem = { path = "crates/vardefm-modem" }
vardefm-link = { path = "crates/vardefm-link" }
vardefm-tnc = { path = "crates/vardefm-tnc" }
vardefm-ptt = { path = "crates/vardefm-ptt" }
vardefm-audio = { path = "crates/vardefm-audio" }
cpal = "0.18"
serialport = { version = "4.10", default-features = false }
hidapi = { version = "2.6", default-features = false, features = ["windows-native", "linux-native-basic-udev"] }

[profile.release]
debug = 1

[profile.dev]
opt-level = 2

# Release binaries (GitHub Actions): slower to build, faster to run, which matters on a Pi.
[profile.dist]
inherits = "release"
debug = 0
strip = true
lto = true
codegen-units = 1
