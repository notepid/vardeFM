# Push a tag like v0.2.0 to build and publish a GitHub release. The tag must
# match the version in Cargo.toml. Tags with a suffix (v0.2.0-rc1) become
# pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check version and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Tag matches Cargo.toml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "vardefm-cli") | .version')
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $cargo_version in Cargo.toml"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - run: cargo test --workspace --locked

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.check.outputs.version }}

  publish:
    name: Publish release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > checksums.txt && cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "VardeFM ${GITHUB_REF_NAME}" \
            --generate-notes --verify-tag $prerelease
