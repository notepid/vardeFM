# Builds the release archives for every platform. Called by ci.yml (snapshot
# builds on every push) and release.yml (tagged releases, with the XCFramework).
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version in the archive names, e.g. 0.2.0
        type: string
        required: true
      xcframework:
        description: Also build the Apple XCFramework (five LTO builds on a macOS runner)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows_amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Ubuntu 22.04 (glibc 2.35): runs on Debian 12 / Raspberry Pi OS Bookworm and newer.
          - name: linux_amd64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # 64-bit Raspberry Pi OS (Pi 3, 4, 5, Zero 2 W), built natively on an ARM runner.
          - name: linux_arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # 32-bit Raspberry Pi OS (Pi 2, 3, 4, Zero 2 W). Every armv7 Pi has NEON.
          - name: linux_armv7
            os: ubuntu-22.04-arm
            target: armv7-unknown-linux-gnueabihf
            armhf: true
            cross: true
            rustflags: -C target-feature=+neon
          # macOS 11 or newer. Apple Silicon is built natively; Intel is cross-compiled
          # on the same runner (so it cannot run the smoke test there).
          - name: darwin_arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: darwin_amd64
            os: macos-latest
            target: x86_64-apple-darwin
            cross: true
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist-${{ matrix.target }}

      - name: Install ALSA headers
        if: runner.os == 'Linux' && !matrix.armhf
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Install armhf cross compiler and ALSA
        if: matrix.armhf
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6-dev-armhf-cross libasound2-dev:armhf pkg-config
          {
            echo "CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc"
            echo "PKG_CONFIG_ALLOW_CROSS=1"
            echo "PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig"
          } >> "$GITHUB_ENV"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      # One notices file covers every target listed in about.toml.
      - name: Third-party licenses
        shell: bash
        run: |
          # Comments are stripped first, so a commented-out target does not count.
          if ! sed 's/#.*//' about.toml | grep -q '"${{ matrix.target }}"'; then
            echo "::error::add ${{ matrix.target }} to targets in about.toml"
            exit 1
          fi
          cargo about generate --locked --fail -m crates/vardefm-cli/Cargo.toml about.hbs -o THIRD-PARTY-LICENSES.html

      - name: Build
        run: cargo build --profile dist --locked --target ${{ matrix.target }} -p vardefm-cli

      - name: Package
        shell: bash
        run: |
          dir="vardefm_${{ inputs.version }}_${{ matrix.name }}"
          mkdir -p "dist/$dir/docs"
          cp LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES.html "dist/$dir/"
          cp packaging/README.md "dist/$dir/README.md"   # the user guide, not the developer README
          cp docs/*.md "dist/$dir/docs/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp "../target/${{ matrix.target }}/dist/vardefm.exe" "$dir/"
            7z a -tzip "$dir.zip" "$dir" > /dev/null
          else
            cp "../target/${{ matrix.target }}/dist/vardefm" "$dir/"
            if [ "$RUNNER_OS" = Linux ]; then
              cp ../packaging/linux/*.rules "$dir/"
            else
              # Apple Silicon refuses to run unsigned code; sign ad hoc (no Apple ID needed).
              codesign --force --sign - "$dir/vardefm"
            fi
            tar czf "$dir.tar.gz" "$dir"
          fi
          ls -l

      - name: Smoke test
        if: '!matrix.cross'
        shell: bash
        run: |
          ./dist/vardefm_*/vardefm --version
          ./dist/vardefm_*/vardefm --help > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: vardefm_${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  xcframework:
    name: Build Apple XCFramework
    if: inputs.xcframework
    runs-on: macos-latest
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '16.0'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: xcframework
      # The version is written into the header, so --verify needs the one that generated it.
      - name: Install cbindgen
        run: cargo install cbindgen --locked --version 0.29.4
      - name: FFI has no desktop dependencies
        run: |
          tree="$(cargo tree -p vardefm-ffi --prefix none --locked)"
          echo "$tree"
          for bad in cpal hidapi serialport hound vardefm-ptt vardefm-audio vardefm-tnc vardefm-sim; do
            if echo "$tree" | grep -E "^${bad} " >/dev/null; then
              echo "::error::$bad must not appear in vardefm-ffi's dependency tree"
              exit 1
            fi
          done
      - name: Verify C header
        run: cbindgen -c crates/vardefm-ffi/cbindgen.toml -o crates/vardefm-ffi/include/CVardeFM/vardefm.h crates/vardefm-ffi --verify
      - name: Build XCFramework
        run: ./packaging/apple/build-xcframework.sh
      - name: Swift package tests
        working-directory: packaging/apple
        run: swift test
      - name: C smoke test
        run: |
          cargo build --profile dist --locked -p vardefm-ffi --target aarch64-apple-darwin
          cc -I crates/vardefm-ffi/include -o /tmp/vfm_smoke \
            crates/vardefm-ffi/tests/smoke.c \
            target/aarch64-apple-darwin/dist/libvardefm.a \
            -framework Security -framework CoreFoundation -lm
          /tmp/vfm_smoke
      - name: Package release zip
        run: |
          mkdir -p dist
          cp packaging/apple/build/VardeFM.xcframework.zip \
            "dist/vardefm_${{ inputs.version }}_apple_xcframework.zip"
          cp packaging/apple/build/VardeFM.xcframework.zip.checksum \
            "dist/vardefm_${{ inputs.version }}_apple_xcframework.zip.checksum"
      - uses: actions/upload-artifact@v7
        with:
          name: vardefm_apple_xcframework
          path: |
            dist/*.zip
            dist/*.checksum
          if-no-files-found: error
          retention-days: 7
