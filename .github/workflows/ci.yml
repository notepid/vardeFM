name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm runs the tests on the same CPU family as a Raspberry Pi.
        os: [ubuntu-latest, windows-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: rustfmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Receive benchmark
        if: runner.arch == 'ARM64'
        run: cargo run -q --locked -p vardefm-cli -- bench

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A new advisory can appear on any day without a change here; keep it from
        # blocking merges, but let a license or source problem fail the build.
        # advisories.yml runs the advisory check weekly and fails visibly.
        checks: [advisories, bans licenses sources]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # The C ABI on every push. The XCFramework and the Swift tests need five LTO builds
  # on a macOS runner, so they only run for a release (build.yml).
  ffi:
    name: C ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi
      # The version is written into the header, so --verify needs the one that generated it.
      - name: Install cbindgen
        run: cargo install cbindgen --locked --version 0.29.4
      - name: FFI has no desktop dependencies
        run: |
          tree="$(cargo tree -p vardefm-ffi --prefix none --locked)"
          echo "$tree"
          for bad in cpal hidapi serialport hound vardefm-ptt vardefm-audio vardefm-tnc vardefm-sim; do
            if echo "$tree" | grep -E "^${bad} " >/dev/null; then
              echo "::error::$bad must not appear in vardefm-ffi's dependency tree"
              exit 1
            fi
          done
      - name: Verify C header
        run: cbindgen -c crates/vardefm-ffi/cbindgen.toml -o crates/vardefm-ffi/include/CVardeFM/vardefm.h crates/vardefm-ffi --verify
      - name: C smoke test
        run: |
          cargo build --locked -p vardefm-ffi
          cc -I crates/vardefm-ffi/include -o /tmp/vfm_smoke \
            crates/vardefm-ffi/tests/smoke.c target/debug/libvardefm.a \
            -lpthread -ldl -lm
          /tmp/vfm_smoke

  # Undefined behaviour at the C ABI (docs/EMBEDDING.md). The nightly is pinned so
  # that a new Miri cannot fail a build that changed nothing.
  miri:
    name: Miri (C ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-17
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri
      - name: C ABI tests under Miri
        run: cargo miri test -p vardefm-ffi --locked


  snapshot:
    name: Build all release targets
    uses: ./.github/workflows/build.yml
    with:
      version: snapshot-${{ github.run_number }}
